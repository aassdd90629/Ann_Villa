name: Build & Verify (CI)

on:
  push:
    branches:
      - master
      - main
      # ⚠️ 嚴禁將 dev 加入觸發分支！遵照全域部署保護規範，僅允許 master/main 觸發
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'ci-build'
  cancel-in-progress: true

jobs:
  build:
    name: Build & SSG Prerender Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project & SSG Prerender
        run: npm run build
