name: Deploy to GitHub Pages & Cloudflare

on:
  push:
    branches:
      - master
      - main
      # ⚠️ 嚴禁將 dev 加入觸發分支！dev 受 GitHub Pages 環境保護規則限制，僅允許 master/main 執行部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project (Auto-syncs iCal & builds dist)
        env:
          VITE_BASE_PATH: '/Ann_Villa/'
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # 若在 GitHub Repository Secrets 中配置了 CLOUDFLARE_API_TOKEN 與 CLOUDFLARE_ACCOUNT_ID，
      # 同步發布至 Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ann-villa
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # 僅 master / main 分支發佈至 GitHub Pages
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
