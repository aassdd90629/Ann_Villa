name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
      - main
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project (Auto-syncs iCal & builds dist)
        run: npm run build

      # 若在 GitHub Repository Secrets 中配置了 CLOUDFLARE_API_TOKEN 與 CLOUDFLARE_ACCOUNT_ID，
      # Actions 會自動將 dist 發布至 Cloudflare Pages！
      # （若直接在 Cloudflare Pages Dashboard 連接 GitHub Repo，亦可由 Cloudflare 端自動觸發 Build，兩者皆相容）
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ann-villa
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
